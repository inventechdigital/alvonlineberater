name: Build Widget

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-widget:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build widget bundle (Shadow DOM version)
        run: npm run build
        env:
          BUILD_TARGET: widget

      - name: Build embed bundle (Native version)
        run: npx vite build --config vite.config.embed.ts

      - name: Copy bundles to public folder (Lovable hosting)
        run: |
          # Lovable serves static assets from /public in the published app
          cp -f dist-widget/onlineberater-widget.js public/onlineberater-widget.js
          cp -f dist-embed/onlineberater-embed.js public/onlineberater-embed.js
          # Copy embed CSS if generated separately
          if [ -f dist-embed/onlineberater-embed.css ]; then
            cp -f dist-embed/onlineberater-embed.css public/onlineberater-embed.css
          fi
          
      - name: Commit widget bundles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          mkdir -p dist-widget
          mkdir -p dist-embed
          mkdir -p public
          
          # Add built files
          git add dist-widget/onlineberater-widget.js -f
          git add dist-embed/ -f
          git add public/onlineberater-widget.js -f
          git add public/onlineberater-embed.js -f
          git add public/onlineberater-embed.css -f 2>/dev/null || true
          
          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "🔧 Auto-build: Update widget bundles"
          
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
